name: touchline-dev

services:
  postgres:
    image: postgres:17-bookworm
    container_name: touchline-postgres
    restart: unless-stopped
  
    env_file:
      - .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend


  auth-service:
    build:
      context: ./services/auth-service
  
    container_name: touchline-auth

    env_file:
      - .env
      
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}

    restart: unless-stopped

    ports:
      - "127.0.0.1:3001:3000"

    networks:
      - backend

    depends_on:
        - postgres

  social-service:
    build: 
      context: ./services/social-service
    
    container_name: touchline-social

    restart: unless-stopped

    env_file:
      - .env
    
    environment:
      DATABASE_URL: ${SOCIAL_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    
    ports:
      - "127.0.0.1:3002:3000"

    networks:
      - backend
    volumes:
      - ./services/social-service/images:/app/images

    depends_on:
      - postgres

























volumes:
  postgres_data:

networks:
  backend: