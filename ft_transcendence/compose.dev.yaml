  frontend:
    command: npm run dev

    build:
      context: ./frontend

    container_name: touchline-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

    environment:
      AUTH_SERVICE_URL: http://auth-service:3000
      SOCIAL_SERVICE_URL: http://social-service:3000

    networks:
      - app


volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:

networks:
  database:
  app:
