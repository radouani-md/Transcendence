name: touchline-dev

services:
  postgres:
    image: postgres:17-bookworm
    container_name: touchline-postgres

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped
  
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}

    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database


  auth-service:
    command: sh -c "npx prisma generate && npm run start:dev -- --no-shell"
    build:
      context: ./services/auth-service
  
    container_name: touchline-auth

    env_file:
      - .env
      
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"

    restart: unless-stopped

    ports:
      - "127.0.0.1:3001:3000"

    volumes:
      - ./services/auth-service:/app
      - /app/node_modules

    networks:
      - database
      - app

    depends_on:
        postgres:
          condition: service_healthy

  social-service:
    command: sh -c "npx prisma generate && npm run start:dev -- --no-shell"
    build: 
      context: ./services/social-service
    
    container_name: touchline-social

    restart: unless-stopped

    env_file:
      - .env
    
    environment:
      DATABASE_URL: ${SOCIAL_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"
    
    ports:
      - "127.0.0.1:3002:3000"

    networks:
      - database
      - app
    volumes:
      - ./services/social-service:/app
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy








  frontend:
    command: npm run dev

    build:
      context: ./frontend

    container_name: touchline-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

    environment:
      AUTH_SERVICE_URL: http://auth-service:3000
      SOCIAL_SERVICE_URL: http://social-service:3000

    networks:
      - app











volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:


networks:
  database:
  app:
