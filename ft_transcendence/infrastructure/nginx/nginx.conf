events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2;
        

        set $upstream_social http://social-service:3000;
        set $upstream_marketplace http://marketplace-service:3000;
        set $upstream_auth http://auth-service:3000;
        set $upstream_frontend http://frontend:3000;

        client_max_body_size 50m;

        location / {
            proxy_pass $upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            
        }

        location /api/ {
            proxy_pass $upstream_social;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }

        location /api/product {
            proxy_pass $upstream_marketplace;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
        location /upload/ {
            proxy_pass http://social-service:3000;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

        }
        location /marketplace-upload/ {
            proxy_pass http://marketplace-service:3000;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

        }
        location /auth/ {
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        
        }
        location /images/ {
            proxy_pass $upstream_social;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            
        }

        location /videos/ {
            proxy_pass $upstream_social;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

        }
    }
}